<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 2rem auto; max-width: 800px; padding: 0 1rem; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.15rem; margin-top: 2rem; }
      textarea { width: 100%; min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace; }
      button { padding: 0.5rem 1rem; }
      button[disabled] { opacity: 0.6; cursor: not-allowed; }
      .items { margin-top: 1rem; }
      .item { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
      .muted { color: #6b7280; font-size: 0.875rem; }
      .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .notes-list { list-style: none; padding: 0; }
      .notes-list li { border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
      .note-meta { display: flex; gap: 0.75rem; color: #6b7280; font-size: 0.8125rem; margin-bottom: 0.25rem; }
      .note-content { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <h1>Action Item Extractor</h1>
    <p class="muted">Paste notes and extract actionable items. Minimal raw HTML frontend.</p>

    <label for="text">Notes</label>
    <textarea id="text" placeholder="Paste notes here...&#10;e.g.&#10;- [ ] Set up database&#10;- Implement extract endpoint"></textarea>
    <div class="row">
      <label class="row"><input id="save_note" type="checkbox" checked /> Save as note</label>
      <button id="extract">Extract</button>
      <button id="extract_llm" title="Use the local Ollama LLM instead of the heuristic extractor">Extract (LLM)</button>
    </div>

    <div class="items" id="items"></div>

    <h2>Saved Notes</h2>
    <div class="row">
      <button id="list_notes">List Notes</button>
    </div>
    <div id="notes_status" class="muted"></div>
    <ul class="notes-list" id="notes_list"></ul>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const itemsEl = $('#items');
      const notesListEl = $('#notes_list');
      const notesStatusEl = $('#notes_status');
      const extractBtn = $('#extract');
      const extractLlmBtn = $('#extract_llm');
      const listNotesBtn = $('#list_notes');
      const allButtons = [extractBtn, extractLlmBtn, listNotesBtn];

      // Disables every action button while `fn` runs, then re-enables in
      // finally. Prevents double-submit on the slow LLM path. Also prevents
      // the user from kicking off /notes during an in-flight extract.
      async function withButtonsDisabled(fn) {
        allButtons.forEach((b) => (b.disabled = true));
        try {
          return await fn();
        } finally {
          allButtons.forEach((b) => (b.disabled = false));
        }
      }

      // Render an array of {id, text} action items into itemsEl using DOM
      // creation rather than innerHTML. `it.text` is user-supplied (or
      // LLM-supplied — same thing from a security standpoint) and must
      // never be interpolated into HTML.
      function renderItems(items) {
        itemsEl.replaceChildren();
        if (!items || items.length === 0) {
          const p = document.createElement('p');
          p.className = 'muted';
          p.textContent = 'No action items found.';
          itemsEl.appendChild(p);
          return;
        }
        for (const it of items) {
          const div = document.createElement('div');
          div.className = 'item';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.id = String(it.id);
          cb.addEventListener('change', async (e) => {
            const id = e.target.dataset.id;
            await fetch(`/action-items/${id}/done`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: e.target.checked }),
            });
          });

          const span = document.createElement('span');
          span.textContent = it.text;

          div.appendChild(cb);
          div.appendChild(span);
          itemsEl.appendChild(div);
        }
      }

      // Shared body for both "Extract" buttons. The endpoint URL is the only
      // thing that varies; request shape and response shape are identical.
      async function runExtract(endpoint) {
        const text = $('#text').value;
        const save = $('#save_note').checked;
        itemsEl.replaceChildren();
        const loading = document.createElement('p');
        loading.className = 'muted';
        loading.textContent = 'Extracting...';
        itemsEl.appendChild(loading);

        await withButtonsDisabled(async () => {
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text, save_note: save }),
            });
            if (!res.ok) throw new Error(`Request failed: ${res.status}`);
            const data = await res.json();
            renderItems(data.items);
          } catch (err) {
            console.error(err);
            itemsEl.replaceChildren();
            const p = document.createElement('p');
            p.className = 'muted';
            p.textContent = 'Error extracting items';
            itemsEl.appendChild(p);
          }
        });
      }

      extractBtn.addEventListener('click', () => runExtract('/action-items/extract'));
      extractLlmBtn.addEventListener('click', () => runExtract('/action-items/extract-llm'));

      // List-notes flow: read-only, separate display area.
      function renderNotes(notes) {
        notesListEl.replaceChildren();
        if (!notes || notes.length === 0) {
          notesStatusEl.textContent = 'No notes yet.';
          return;
        }
        notesStatusEl.textContent = `${notes.length} note${notes.length === 1 ? '' : 's'}.`;
        for (const note of notes) {
          const li = document.createElement('li');

          const meta = document.createElement('div');
          meta.className = 'note-meta';
          const idSpan = document.createElement('span');
          idSpan.textContent = `#${note.id}`;
          const tsSpan = document.createElement('span');
          tsSpan.textContent = note.created_at;
          meta.appendChild(idSpan);
          meta.appendChild(tsSpan);

          const content = document.createElement('div');
          content.className = 'note-content';
          content.textContent = note.content;

          li.appendChild(meta);
          li.appendChild(content);
          notesListEl.appendChild(li);
        }
      }

      listNotesBtn.addEventListener('click', async () => {
        notesStatusEl.textContent = 'Loading...';
        notesListEl.replaceChildren();
        await withButtonsDisabled(async () => {
          try {
            const res = await fetch('/notes');
            if (!res.ok) throw new Error(`Request failed: ${res.status}`);
            renderNotes(await res.json());
          } catch (err) {
            console.error(err);
            notesStatusEl.textContent = 'Error loading notes';
          }
        });
      });
    </script>
  </body>
</html>
